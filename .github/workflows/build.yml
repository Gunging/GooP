name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 25 compiles both editions (--release 17 for legacy, 21 for modern)
      # and can read the Java 25 class files of the 26.x Paper API.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and unit test
        run: mvn -B verify

      - name: API compatibility matrix
        run: sh tools/compat/check-matrix.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GooP-jars
          path: dist/*.jar
